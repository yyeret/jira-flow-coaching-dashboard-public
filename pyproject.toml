[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Preserve the original lint policy independently of Ruff's changing defaults.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E701", # Multiple statements on one line (colon)
    "E741", # Ambiguous variable name (e.g. 'l')
    "E722", # Bare except
]
