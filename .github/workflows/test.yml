name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install JS dependencies
      run: npm ci
      
    - name: Install Python dependencies
      run: pip install -r requirements.txt
      
    - name: Run Linter (ESLint, Prettier, Ruff)
      run: npm run lint

    - name: Run Tests (Jest & Pytest)
      run: npm test

    - name: Check public source tree
      run: python scripts/check_public_tree.py

    - name: Audit locked JavaScript dependencies
      run: npm audit --audit-level=moderate

    - name: Scan Git history for credentials
      run: python scripts/scan_secrets.py --history

    - name: Audit Python dependency resolution
      run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt
